# blog.moxi2534.com —— Nginx 站点配置
# 用法：复制到 /etc/nginx/conf.d/blog.moxi2534.com.conf，然后 nginx -t && systemctl reload nginx
# HTTPS 用 `certbot --nginx -d blog.moxi2534.com --redirect` 自动补全。

server {
    listen 80;
    listen [::]:80;
    server_name blog.moxi2534.com;

    root /var/www/blog;
    index index.html;
    charset utf-8;

    # 构建产物带内容哈希，可以永久缓存
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pagefind 搜索索引同样是构建期产物
    location /pagefind/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Astro 静态输出：/about/ -> /about/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
